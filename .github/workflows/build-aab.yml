name: Build AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci
        env:
          CI: "1"

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Decode upload keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/fakarny-upload.keystore
          ls -la android/app/fakarny-upload.keystore

      - name: Inject release signing config
        run: python3 .github/scripts/inject-signing.py

      - name: Build release bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish AAB as release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-builds >/dev/null 2>&1 || gh release create ci-builds --title "CI builds" --notes "Internal CI build artifacts. The AAB asset is overwritten by each new build."
          gh release upload ci-builds android/app/build/outputs/bundle/release/app-release.aab --clobber

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: fakarny-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
